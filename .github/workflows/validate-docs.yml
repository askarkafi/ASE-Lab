name: Validate documentation

on:
  push:
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check relative Markdown links
        run: python scripts/check_docs.py
